name: Einfach Hausen quality gate

on:
  push:
    branches: [main]
  pull_request:
  # Visual baselines are rendered by Chromium on Linux. Regenerating them
  # anywhere else bakes in that machine's font rasterisation and antialiasing,
  # which on its own moves ~2.7% (up to 6.5%) of pixels - enough to fail the
  # 8% budget on pages that did not change at all. Refresh them in CI instead.
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Visual baselines in CI neu erzeugen und als PR liefern'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, build, security and browser acceptance
    runs-on: ubuntu-latest
    # This job carries the whole chain: build, four browser-driven suites
    # (website + apps visual regression, responsive matrix, three a11y passes)
    # and every domain suite. Steps 1-11 alone take ~6.5 minutes, and the two
    # suites that boot their own dev server (CRM, architecture) plus the full
    # browser acceptance add roughly 15 more. At 20 minutes the job was killed
    # around step 21, which is why "architecture acceptance" and "production
    # smoke contract" had never run at all. The budget has to cover the chain
    # it actually contains, otherwise the last steps are decorative.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Lint
        run: npm run lint
      # Die Design-Ratsche haengt am selben Job wie Build, a11y und E2E.
      # Vorher lief sie nur in eh-design.yml — und 3585 Verstoesse wurden
      # dort stillschweigend geduldet, weil die Baseline nur "nicht schlechter
      # als der Hoechststand" verlangte.
      - name: Design consistency (ratchet)
        run: npm run design:check
      - name: Design rules unit tests
        run: node --test scripts/eh-design-check.test.mjs
      # Dasselbe Muster fuer totes CSS: die Kaskade ist geschichtet und die
      # Rohwerte sind whitelisted, aber ohne diese Sperre waechst der Muell
      # weiter, nur langsamer. Vier Pruefungen, drei Zaehler als Ratsche.
      - name: Dead CSS and design budgets (ratchet)
        run: npm run design:deadcss
      - name: Dead CSS rules unit tests
        run: node --test scripts/eh-design-deadcss.test.mjs
      # next-env.d.ts is gitignored (see .gitignore) and is regenerated by
      # `next typegen`. A bare `tsc --noEmit` on a clean checkout therefore
      # fails with TS2307 on every asset import (e.g. site-shell.tsx ->
      # ./assets/logo-full.png). Use the repo's own script, which runs
      # `next typegen && tsc --noEmit`.
      - name: Type check
        run: npm run typecheck
      # The client Supabase origin is inlined at build time (NEXT_PUBLIC_*).
      # A build without it makes scripts/e2e.mjs fail its bundle check
      # ("Client bundle lacks the inlined Supabase origin").
      - name: Production build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Performance budgets
        run: npm run test:perf
      - name: Accessibility (axe)
        run: npm run test:a11y
      - name: Visual regression (website)
        run: npm run test:visual
      - name: Visual regression (apps)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:visual:apps
      - name: Responsive matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:responsive
      - name: Accessibility (apps)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:a11y:apps
      - name: Accessibility matrix (keyboard + axe, all surfaces)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:a11y:matrix
      - name: Security regressions
        run: npm run test:security
      - name: Supply-chain gate (audit, lockfile, secrets, artifacts, SBOM)
        run: npm run test:supply-chain
      - name: Deterministic fixture factory
        run: npm run test:fixtures
      - name: Domain regression suites
        run: |
          npm run test:i18n
          npm run test:intake
          npm run test:matching
          npm run test:onboarding
          npm run test:notifications
          npm run test:matching:t0107
          npm run test:matching:benchmark
          npm run test:review
          # T-0122/T-0132 ran in no workflow at all until now - which is why the
          # error-tracking suite could rot to ERR_MODULE_NOT_FOUND unnoticed, and
          # why two error boundaries reported nothing for weeks. test:error-tracking
          # also guards that every boundary under src/app wires useErrorReport.
          npm run test:observability
          npm run test:error-tracking
      - name: CRM acceptance
        run: npm run test:crm
      - name: Architecture acceptance
        # The suite registers real accounts, and registration is fail-closed on
        # the Supabase identity authority (src/app/actions.ts:120-123): without a
        # service-role key it redirects to "Registrierung aktuell nicht
        # verfuegbar" and the suite dies on its first navigation. This step used
        # to run without credentials, which is why it failed the first time it
        # ever got to execute. It also relies on the production build from the
        # step above, which carries the inlined Supabase origin.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e:architecture
      # Steps 9 (perf) and 10 (a11y) each rebuild .next through
      # scripts/release-gate.mjs. That helper reads the build env from
      # /etc/einfach-hausen-build.env or .env.build.local, neither of which
      # exists on a runner, so those builds inherit the step environment - and
      # neither step carries the Supabase build env. They therefore overwrite
      # the inlined client origin that step 8 wrote into .next.
      # scripts/e2e.mjs refuses to run against a bundle without it (T-0147,
      # T-0200), which is why this step failed the first time it ever executed.
      # .next is shared mutable state across steps: rebuild it here instead of
      # trusting whatever the previous step left behind.
      - name: Production build (Supabase build env, for browser acceptance)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Browser product acceptance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e
      - name: Production smoke contract
        run: npm run test:smoke

  browser-matrix:
    name: browser acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx --yes playwright@1.62.1 install --with-deps ${{ matrix.browser }}
      # scripts/e2e.mjs requires .next/BUILD_ID and an inlined Supabase origin,
      # so the matrix jobs must build before running the E2E suite. Without
      # this step every browser job failed with "No production build found".
      - name: Production build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Browser product acceptance
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e

  # Refresh the visual baselines on the very Linux runner that later verifies
  # them. Manual dispatch only, and it opens a PR instead of pushing straight
  # to main: a new baseline records a design decision, so it needs review.
  visual-baselines:
    name: refresh visual baselines
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_baselines == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Production build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Regenerate website baselines
        run: npm run test:visual:update
      - name: Regenerate app baselines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:visual:apps:update
      - name: Open pull request with the new baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/visual-baselines-${{ github.run_number }}"
          git checkout -B "$branch"
          git add tests/visual-baselines
          if git diff --cached --quiet; then
            echo "Baselines unveraendert - kein PR noetig."
            exit 0
          fi
          git commit -m "chore(visual): Baselines auf dem Linux-Runner neu erzeugen (Run ${{ github.run_number }})"
          git push --force origin "$branch"
          printf '%s\n' "Automatisch erzeugt durch workflow_dispatch (update_baselines), Run ${{ github.run_number }}." "" "Bitte die Diff-Bilder im Review ansehen - eine neue Baseline ist eine Design-Entscheidung." > /tmp/pr-body.md
          gh pr create --title "chore(visual): Baselines neu erzeugen (Run ${{ github.run_number }})" --body-file /tmp/pr-body.md --base main --head "$branch"
