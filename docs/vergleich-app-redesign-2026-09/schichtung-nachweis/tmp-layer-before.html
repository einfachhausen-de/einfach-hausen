:root {
  --green: #105258;
  --green-dark: #0d4448;
  --green-soft: #dcebec;
  --ink: #0b1623;
  --navy: #061522;
  --navy2: #0d2031;
  --muted: #6e7780;
  --muted-shadcn: oklch(0.97 0 0);
  --line: #e6e9e7;
  --bg: #f6f8f6;
  --white: #fff;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --chart-1: oklch(0.87 0 0);
  --chart-2: oklch(0.556 0 0);
  --chart-3: oklch(0.439 0 0);
  --chart-4: oklch(0.371 0 0);
  --chart-5: oklch(0.269 0 0);
  --radius: 0.625rem;
  --sidebar: oklch(0.985 0 0);
  --sidebar-foreground: oklch(0.145 0 0);
  --sidebar-primary: oklch(0.205 0 0);
  --sidebar-primary-foreground: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.97 0 0);
  --sidebar-accent-foreground: oklch(0.205 0 0);
  --sidebar-border: oklch(0.922 0 0);
  --sidebar-ring: oklch(0.708 0 0);
}
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font-marketing),Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color: var(--ink);
  background: var(--bg);
}
@layer base {
  a {
    text-decoration: none;
    color: inherit;
  }
}
button,input,textarea,select {
  font: inherit;
}
button {
  cursor: pointer;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #0d4448;
}
.brand[data-inverse=true] {
  color: white;
}
.brand-icon {
  width: 42px;
  height: 38px;
  border: 2px solid currentColor;
  border-radius: 8px;
  display: grid;
  place-items: center;
  position: relative;
}
.brand-icon b {
  font-size: 10px;
  position: absolute;
  bottom: 2px;
}
.brand>span:last-child {
  display: flex;
  flex-direction: column;
}
.brand strong {
  font-size: 15px;
}
.brand small {
  font-size: 11px;
  color: #68726b;
}
.btn {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: .15s;
}
.btn:hover {
  transform: translateY(-1px);
}
.btn.primary {
  background: var(--green);
  color: white;
}
.btn.dark {
  background: #102235;
  color: white;
}
.btn.light {
  background: white;
  color: #0d2031;
}
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
}
.wide {
  width: 100%;
}
.landing {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  max-width: 1180px;
  margin: auto;
  gap: 80px;
  padding: 80px 32px;
  align-items: center;
}
.landing-copy .brand {
  margin-bottom: 45px;
}
.eyebrow {
  color: var(--green-dark);
  font-weight: 800;
}
.landing h1 {
  font-size: clamp(42px,6vw,72px);
  line-height: 1.03;
  letter-spacing: -.04em;
  margin: 10px 0 22px;
}
.landing h1 span {
  color: var(--green-dark);
}
.landing-copy>p:not(.eyebrow) {
  font-size: 19px;
  line-height: 1.65;
  color: #55605a;
  max-width: 650px;
}
.landing-actions {
  display: flex;
  gap: 12px;
  margin: 28px 0 16px;
  flex-wrap: wrap;
}
.login-link {
  font-weight: 650;
  color: #46504a;
}
.feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.feature-grid article {
  background: white;
  border: 1px solid #edf0ee;
  border-radius: 18px;
  padding: 22px;
  display: flex;
  gap: 15px;
  box-shadow: 0 14px 45px rgba(21,45,31,.05);
}
.feature-grid svg {
  color: var(--green);
  flex: 0 0 auto;
}
.feature-grid strong {
  display: block;
  margin-bottom: 5px;
}
.feature-grid p {
  margin: 0;
  color: #68736c;
  line-height: 1.45;
  font-size: 14px;
}
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 30px;
  background: linear-gradient(160deg,#f8faf8,#eef5ec);
}
.auth-card {
  width: min(430px,100%);
  background: white;
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 28px 80px rgba(23,49,31,.12);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.wide-card {
  width: min(560px,100%);
}
.auth-card h1 {
  margin: 12px 0 0;
  font-size: 28px;
}
.auth-card>p {
  margin: 0;
  color: var(--muted);
}
label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 13px;
  font-weight: 700;
}
label small {
  font-weight: 400;
  color: var(--muted);
}
input,textarea,select {
  border: 1px solid #dfe4e0;
  border-radius: 9px;
  background: white;
  padding: 12px 13px;
  outline: none;
  min-width: 0;
}
input:focus,textarea:focus,select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(16,82,88,.12);
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.alert {
  padding: 12px 14px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 8px;
}
.alert.error {
  background: #fff0ef;
  color: #a12b25;
}
.alert.success {
  background: #eaf8e7;
  color: #0d4448;
}
.app-page {
  min-height: 100vh;
  background: radial-gradient(circle at top,#fff,#eef3ef 70%);
  padding: 22px;
}
.phone-shell {
  width: min(480px,100%);
  margin: 0 auto;
  background: white;
  min-height: calc(100vh - 44px);
  border-radius: 36px;
  box-shadow: 0 24px 80px rgba(18,39,27,.16);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid #e7ece8;
}
.topbar {
  padding: 22px 22px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(14px);
  z-index: 10;
}
.topbar>div:first-child {
  display: flex;
  flex-direction: column;
}
.topbar>div:first-child strong {
  font-size: 16px;
}
.topbar>div:first-child small {
  font-size: 12px;
  color: #9caab4;
}
.top-actions {
  display: flex;
  gap: 16px;
}
.screen {
  padding: 8px 20px 92px;
  flex: 1;
}
.bottom-nav {
  height: calc(72px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5,1fr);
  align-items: stretch;
  border-top: 1px solid var(--eh-color-line);
  background: var(--eh-color-white);
  z-index: 15;
  border-radius: 0;
}
.bottom-nav a {
  display: grid;
  grid-template-rows: 22px auto;
  justify-items: center;
  align-content: center;
  gap: 4px;
  min-width: 0;
  padding: 8px 6px 6px;
  font-size: var(--eh-font-meta);
  line-height: 1.25;
  color: var(--eh-color-secondary);
  text-align: center;
}
.bottom-nav a span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bottom-nav a.active {
  color: var(--eh-color-petrol);
  font-weight: 650;
}
.hello h1,.page-title {
  margin: 8px 0 2px;
  font-size: 23px;
}
.hello p {
  margin: 0 0 18px;
  color: #535c56;
}
.request-card {
  background: #f8faf8;
  border: 1px solid #edf1ee;
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.request-bubble {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.request-bubble svg {
  color: var(--green);
}
.request-bubble strong {
  font-size: 13px;
}
.request-bubble p {
  font-size: 12px;
  color: var(--muted);
  margin: 2px 0;
}
.request-card textarea {
  background: #dcebec;
  border: 0;
}
.request-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.file-label {
  font-weight: 600;
  color: #4d574f;
}
.file-label input {
  padding: 8px;
  font-size: 12px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 22px 0 10px;
}
.section-title strong {
  font-size: 14px;
}
.section-title a {
  font-size: 12px;
  color: var(--green-dark);
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.job-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 9px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
}
.job-row img,.thumb-placeholder {
  width: 60px;
  height: 54px;
  border-radius: 10px;
  object-fit: cover;
  background: #dcebec;
  display: grid;
  place-items: center;
  color: var(--green);
}
.grow {
  flex: 1;
  min-width: 0;
}
.job-row strong {
  display: block;
  font-size: 13px;
}
.job-row small,.job-card small,.pro-request small {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #65706a;
  font-size: 10px;
  margin-top: 4px;
}
.job-row span {
  font-size: 10px;
  color: var(--green-dark);
  font-weight: 700;
}
.job-row .right {
  display: flex;
  align-items: center;
  gap: 4px;
}
.job-row .right b {
  color: var(--green-dark);
  font-size: 13px;
}
.empty {
  border: 1px dashed #d7dfd9;
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: #6c766f;
}
.empty svg {
  color: var(--green);
  margin-bottom: 8px;
}
.empty strong {
  color: var(--ink);
}
.empty p {
  margin: 5px 0 0;
  font-size: 12px;
}
.empty.compact {
  padding: 16px;
}
.job-card {
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.job-card h3 {
  margin: 7px 0 5px;
}
.job-card p {
  font-size: 12px;
  line-height: 1.45;
  color: #59635d;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.job-card-side {

.nf-shell h1 {
  margin: 16px 0 0;
  font-size: clamp(30px,4vw,44px);
  font-weight: 700;
  letter-spacing: -.03em;
  color: var(--eh-text);
}
.nf-shell p {
  margin: 12px 0 0;
  max-width: 440px;
  color: var(--eh-text-secondary);
  font-size: 15px;
  line-height: 1.6;
}
.nf-actions {
  display: flex;
  gap: 10px;
  margin-top: 26px;
  flex-wrap: wrap;
  justify-content: center;
}
.nf-primary, .nf-ghost {
  min-height: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  padding: 0 20px;
  font-size: 15px;
  font-weight: 680;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
}
.nf-primary {
  background: var(--eh-green-700);
  color: var(--eh-surface);
  box-shadow: 0 14px 30px -14px rgba(10,53,57,.55);
}
.nf-ghost {
  background: var(--eh-surface);
  color: var(--eh-text);
  border: 1px solid var(--eh-border-strong);
}
@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}
::selection {
  background: var(--eh-green-100);
}
html {
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}
.ehn-reg-page, .role2-page {
  background: radial-gradient(800px 400px at 80% -10%, #dcebec, transparent 60%),
    #f4f7f7;
  font-family: var(--font-marketing), ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.ehn-reg-page h1, .ehn-reg-page h2, .role2-page h1, .role2-page h2 {
  font-weight: 700;
  letter-spacing: -.03em;
}
.ehn-reg-page .ehn-reg-submit, .ehn-reg-page .btn-primary, .role2-page .btn-primary {
  background: #105258;
  font-weight: 680;
  letter-spacing: -.01em;
}
.ehn-reg-page .ehn-reg-submit:hover, .ehn-reg-page .btn-primary:hover, .role2-page .btn-primary:hover {
  background: #1b8569;
}
.ehn-reg-page .if-wrap input, .role2-page .if-wrap input {
  border-color: #d7dfdc;
}
.ehn-reg-page .if-wrap input:focus, .role2-page .if-wrap input:focus {
  border-color: #105258;
  box-shadow: 0 0 0 4px rgba(16,82,88,.10);
}
.oreg-logo svg path, .oreg-logo svg {
  stroke: #105258;
}
.nf-scene {
  margin-bottom: 10px;
}
.nf-house {
  width: 220px;
  height: auto;
}
.submit-spinner {
  width: 14px;
  height: 14px;
  border-radius: 999px;
  border: 2px solid currentColor;
  border-top-color: transparent;
  display: inline-block;
  animation: eh-spin .7s linear infinite;
}
@keyframes eh-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .submit-spinner {
    animation-duration: 1.6s;
  }
}
